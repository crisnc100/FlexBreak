name: Build and upload to TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flexbreak-production-release
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require current main and a first attempt
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ] || [ "$GITHUB_REPOSITORY" != crisnc100/FlexBreak ]; then
            echo 'Use a fresh Run workflow on main in crisnc100/FlexBreak; do not use Re-run jobs.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  quality:
    needs: dispatch
    uses: ./.github/workflows/ci.yml
  testflight:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and upload the exact iPhone store binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: node scripts/iphone-testflight.mjs
