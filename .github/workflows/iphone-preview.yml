name: Build iPhone Preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flexbreak-production-release
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  preview:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and verify the exact iPhone preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/iphone-preview.mjs
