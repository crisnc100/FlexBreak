name: Production deployment (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flexbreak-production-release
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  production:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Plan cumulative changes from verified production history
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/production-plan.mjs
      - run: npm ci
        if: steps.plan.outputs.mobile == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.plan.outputs.backend == 'true'
        with:
          version: 2.117.0
      - name: Preflight every required gate before any deployment
        env:
          PLAN_BACKEND: ${{ steps.plan.outputs.backend }}
          PLAN_MOBILE: ${{ steps.plan.outputs.mobile }}
          HAS_SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: node scripts/production-preflight.mjs
      - name: Deploy v2 backend first
        if: steps.plan.outputs.backend == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKEND_SELECTION: v2
        run: node scripts/deploy-backend.mjs
      - name: Build and upload the exact iOS artifact
        if: steps.plan.outputs.mobile == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: node scripts/production-mobile.mjs
