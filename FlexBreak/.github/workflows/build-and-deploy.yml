name: Build and Deploy FlexBreak

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [main]

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

jobs:
  # Code Quality Checks
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint code
        run: npm run lint

      - name: 🔍 Type check
        run: npm run type-check

      - name: 🧪 Run tests
        run: npm test

  # Development Build (develop branch)
  dev-build:
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build development app
        run: |
          eas build --platform ios --profile development --non-interactive --no-wait
          eas build --platform android --profile development --non-interactive --no-wait

      - name: 📱 Create development build comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Development builds started! Check EAS dashboard for progress.'
            })

  # TestFlight Build (staging branch)
  testflight-build:
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Auto-increment version
        run: |
          # Get current version from app.json
          CURRENT_VERSION=$(node -p "require('./app.json').expo.version")
          echo "Current version: $CURRENT_VERSION"
          
          # Increment patch version
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          echo "New version: $NEW_VERSION"
          
          # Update app.json
          node -e "
            const fs = require('fs');
            const app = require('./app.json');
            app.expo.version = '$NEW_VERSION';
            app.expo.ios.buildNumber = (parseInt(app.expo.ios.buildNumber) + 1).toString();
            app.expo.android.versionCode = parseInt(app.expo.android.versionCode) + 1;
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2));
          "

      - name: 📝 Generate release notes
        id: release-notes
        run: |
          # Get commits since last release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --since="1 week ago")
          else
            COMMITS=$(git log --oneline $LAST_TAG..HEAD)
          fi
          
          # Format release notes
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "🚀 FlexBreak Update" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "What's New:" >> $GITHUB_OUTPUT
          echo "$COMMITS" | sed 's/^/• /' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🍎 Build for TestFlight
        run: |
          eas build --platform ios --profile testflight --clear-cache --non-interactive --no-wait

      - name: 🤖 Build for Internal Testing
        run: |
          eas build --platform android --profile internal --clear-cache --non-interactive --no-wait

      - name: 📧 Notify team
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            TestFlight build started for FlexBreak!
            
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}
            
            Check EAS dashboard for build progress.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Production Build (main branch)
  production-build:
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Auto-increment version (Production)
        run: |
          # Get current version and increment minor version for production
          CURRENT_VERSION=$(node -p "require('./app.json').expo.version")
          echo "Current version: $CURRENT_VERSION"
          
          # Increment minor version for production releases
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{$(NF-1) = $(NF-1) + 1; $NF = 0;} 1' | sed 's/ /./g')
          echo "New version: $NEW_VERSION"
          
          # Update app.json
          node -e "
            const fs = require('fs');
            const app = require('./app.json');
            app.expo.version = '$NEW_VERSION';
            app.expo.ios.buildNumber = (parseInt(app.expo.ios.buildNumber) + 1).toString();
            app.expo.android.versionCode = parseInt(app.expo.android.versionCode) + 1;
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2));
          "

      - name: 📝 Generate production release notes
        id: prod-release-notes
        run: |
          # Get commits since last production release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --since="2 weeks ago")
          else
            COMMITS=$(git log --oneline $LAST_TAG..HEAD)
          fi
          
          # Format production release notes
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "🎉 FlexBreak Production Release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "New Features & Improvements:" >> $GITHUB_OUTPUT
          echo "$COMMITS" | grep -E "(feat|feature)" | sed 's/^/✨ /' >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Bug Fixes:" >> $GITHUB_OUTPUT
          echo "$COMMITS" | grep -E "(fix|bug)" | sed 's/^/🐛 /' >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Other Changes:" >> $GITHUB_OUTPUT
          echo "$COMMITS" | grep -vE "(feat|feature|fix|bug)" | sed 's/^/• /' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🍎 Build for App Store
        run: |
          eas build --platform ios --profile production --clear-cache --non-interactive --auto-submit

      - name: 🤖 Build for Play Store
        run: |
          eas build --platform android --profile production --clear-cache --non-interactive --auto-submit

      - name: 🏷️ Create Git Tag
        run: |
          NEW_VERSION=$(node -p "require('./app.json').expo.version")
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: 📧 Notify production deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            🚀 PRODUCTION DEPLOYMENT STARTED! 🚀
            
            ${{ steps.prod-release-notes.outputs.RELEASE_NOTES }}
            
            App Store and Play Store submissions initiated.
            Check EAS dashboard for build progress.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🔍 Run security audit
        run: npm audit --audit-level moderate

      - name: 🛡️ Check for vulnerabilities
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Security scan
        run: |
          npx audit-ci --moderate 